[package]
name = "test-fn"
version = "0.1.0"
edition = "2021"
description = "Per-function test runner for shim-bridge verification (B1)."
license = "Apache-2.0"

[[bin]]
name = "test-fn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
